name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  e2e:
    timeout-minutes: 90
    runs-on: ubuntu-latest

    steps:
      - name: Check out test repo
        uses: actions/checkout@v4

      - name: Check out app under test
        env:
          APP_COMMIT: ae7caecb811dd8952c09d997e69be7cb946ecd44
        run: |
          set -euo pipefail
          git clone https://github.com/testsmith-io/practice-software-testing.git ../practice-software-testing
          git -C ../practice-software-testing checkout --detach "$APP_COMMIT"
          echo "Using practice-software-testing commit $(git -C ../practice-software-testing rev-parse HEAD)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install test project dependencies
        run: npm ci

      - name: Install Playwright browsers and OS dependencies
        run: npx playwright install --with-deps

      - name: Start app under test
        run: |
          set -euo pipefail
          cd ../practice-software-testing

          fail_with_logs() {
            echo "::error::$1"
            docker compose ps
            docker compose logs --no-color --tail=100
            return 1
          }

          wait_for_service() {
            local service="$1"
            for attempt in $(seq 1 60); do
              if docker compose ps --status running --services "$service" | grep -Fxq "$service"; then
                echo "Compose service is running: $service"
                return 0
              fi
              sleep 2
            done
            fail_with_logs "Compose service '$service' did not start within 120 seconds"
          }

          wait_for_url() {
            local description="$1"
            local url="$2"
            for attempt in $(seq 1 90); do
              if curl --fail --silent "$url" >/dev/null 2>&1; then
                echo "$description is ready: $url"
                return 0
              fi
              sleep 4
            done
            fail_with_logs "Timed out waiting for $description at $url"
          }

          docker compose up -d mariadb phpmyadmin mailcatcher angular-ui laravel-api cron

          for service in mariadb phpmyadmin mailcatcher angular-ui laravel-api cron; do
            wait_for_service "$service"
          done

          echo "Waiting for MariaDB to accept connections..."
          for attempt in $(seq 1 60); do
            if docker compose exec -T mariadb mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent >/dev/null 2>&1; then
              echo "MariaDB is ready"
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              fail_with_logs "MariaDB did not become ready within 120 seconds"
            fi
            sleep 2
          done

          # Composer is a one-shot service; wait for it to finish before Artisan commands.
          docker compose run --rm composer
          docker compose exec -T -u root laravel-api sh -c "chmod -R 777 storage bootstrap/cache"
          docker compose exec -T laravel-api php artisan migrate:fresh --seed

          # Start nginx after upstream containers and DNS entries are available.
          docker compose up -d web
          wait_for_service web

          wait_for_url "API" http://localhost:8091/brands
          wait_for_url "UI" http://localhost:4200/
          wait_for_url "MailCatcher" http://localhost:1080/

          echo "All app services are ready"

      - name: Run Playwright suite
        run: |
          npx playwright test tests/api-phase-1.spec.ts tests/ui-phase-2.spec.ts tests/defect-phase-3.spec.ts tests/boundary-phase-4.spec.ts --reporter=line

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
