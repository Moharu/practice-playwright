name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  e2e:
    timeout-minutes: 90
    runs-on: ubuntu-latest

    steps:
      - name: Check out test repo
        uses: actions/checkout@v4

      - name: Check out app under test
        run: git clone https://github.com/testsmith-io/practice-software-testing.git ../practice-software-testing

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install test project dependencies
        run: npm ci

      - name: Install Playwright browsers and OS dependencies
        run: npx playwright install --with-deps

      - name: Start app under test
        run: |
          cd ../practice-software-testing

          # Start/build the app stack
          docker compose up -d --build

          # Ensure Composer dependencies are present before running artisan
          for i in $(seq 1 20); do
            if docker compose exec -T laravel-api test -f vendor/autoload.php; then
              break
            fi
            echo "Waiting for Composer dependencies to be installed..."
            sleep 2
          done

          if ! docker compose exec -T laravel-api test -f vendor/autoload.php; then
            echo "Installing Composer dependencies..."
            docker compose exec -T laravel-api composer install --no-interaction --prefer-dist --no-progress
          fi

          # Fix writable permissions
          docker compose exec -u root laravel-api sh -c "chmod -R 777 storage bootstrap/cache"

          # Retry migrations until the database is ready
          attempts=0
          until docker compose exec -T laravel-api php artisan migrate:fresh --seed; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 20 ]; then
              echo "Database migrations failed after $attempts attempts" >&2
              exit 1
            fi
            echo "Migrations failed; retrying in 3s..."
            sleep 3
          done

          # Wait until the API is actually serving requests
          until curl -sf http://localhost:8091/brands > /dev/null; do
            echo "Waiting for API on http://localhost:8091..."
            sleep 3
          done

          echo "App is ready"

      - name: Run Playwright suite
        run: |
          npx playwright test tests/api-phase-1.spec.ts tests/ui-phase-2.spec.ts tests/defect-phase-3.spec.ts tests/boundary-phase-4.spec.ts --reporter=line

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
